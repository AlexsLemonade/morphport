repository_type: pipeline

nf_core_version: 3.5.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pccma-nf_logo_light.png
    - docs/images/nf-core-pccma-nf_logo_light.png
    - docs/images/nf-core-pccma-nf_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-pccma-nf_logo_light.png
    - docs/images/nf-core-pccma-nf_logo_light.png
    - docs/images/nf-core-pccma-nf_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  actions_nf_test: false
  readme: false

template:
  org: AlexsLemonade
  name: pccma
  description: Downstream analysis of Cell Painting data to prepare for the PCCMA
    portal
  author: Joshua Shapiro
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: false
