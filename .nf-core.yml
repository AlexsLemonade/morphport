lint:
  actions_nf_test: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-morphport_logo_light.png
    - docs/images/nf-core-morphport_logo_light.png
    - docs/images/nf-core-morphport_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-morphport_logo_light.png
    - docs/images/nf-core-morphport_logo_light.png
    - docs/images/nf-core-morphport_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
  included_configs: false
  multiqc_config: false
  main_nf_include_versions: false
  pipeline_name_conventions: false
  readme: false
nf_core_version: 4.0.2
repository_type: pipeline
template:
  org: AlexsLemonade
  name: morphport
  description: Downstream analysis of Cell Painting data to prepare for the PCCMA
    portal
  force: false
  is_nfcore: false
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  version: 0.1.0
