name: partition_conditions
description: Joins platemap metadata into a per-plate parquet file and writes Hive-style partitioned output
keywords:
  - cell painting
  - platemap
  - parquet
  - partitioning
  - duckdb
tools:
  - duckdb:
      description: >
        DuckDB is an in-process SQL OLAP database management system.
        Used here for efficient parquet joins and partitioned writes.
      homepage: https://duckdb.org
      documentation: https://duckdb.org/docs/
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing plate metadata,
          e.g. [ plate_id:'plate_001', batch:'batch_1' ]
    - parquet_file:
        type: file
        description: Per-cell parquet file produced by COSMICQC_FILTER
        pattern: "*.parquet"
    - partition_columns:
        type: list
        description: |
          Metadata_-prefixed platemap columns to partition by,
          e.g. [ 'Metadata_cell_line', 'Metadata_treatment' ]

output:
  - partitions:
      - meta:
          type: map
          description: Groovy Map containing plate metadata
      - "${meta.plate_id}":
          type: directory
          description: |
            Hive-partitioned directory of per-cell parquet files. Each subdirectory
            encodes one combination of partition column values as key=value path
            segments (e.g. Metadata_node_type=disease_wt/Metadata_treatment=NA/).
            Each parquet file contains all original cell features plus all platemap
            metadata columns.
            Partition values are percent-encoded in directory names (e.g. 'drug A' → 'drug%20A');
            use the partition manifest for the exact values.
      - "partitions_${meta.plate_id}.json":
          type: file
          description: |
            JSON manifest listing each partition directory (relative to "${meta.plate_id}")
            and its exact partition column values, e.g.
            [ { "path": "Metadata_treatment=drug%20A", "values": { "Metadata_treatment": "drug A" } } ]
          pattern: "partitions_*.json"
  - summary:
      - "platemap_summary_*.json":
          type: file
          description: |
            JSON file recording the platemap file used, partition columns, per-partition
            row counts and file paths, and the count of wells with no platemap entry.
          pattern: "platemap_summary_*.json"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
