name: hierarchical_clustering_samples
description: |
  Computes hierarchical clustering of the samples within an analysis group.
  Clusters either the selected features of the feature-selected profiles or the
  PC1..PCk columns of the PCA embeddings with Ward linkage, using fastcluster's
  memory-saving linkage_vector so that large (e.g. cell-level) groups can be
  clustered without building a pairwise distance matrix.
  Writes the scipy linkage matrix and a table of leaf labels and identifying
  metadata as parquet files, along with a JSON summary of the clustering.
keywords:
  - cell painting
  - hierarchical clustering
  - dendrogram
  - pca
  - ward

tools:
  - fastcluster:
      description: Fast hierarchical clustering library, used here for memory-saving Ward linkage.
      homepage: https://danifold.net/fastcluster.html
      documentation: https://danifold.net/fastcluster.html
      licence: ["BSD-2-Clause"]
      identifier: ""
  - scipy:
      description: Scientific computing library used here to compute the dendrogram leaf order.
      homepage: https://scipy.org
      documentation: https://docs.scipy.org/doc/scipy/reference/cluster.hierarchy.html
      licence: ["BSD-3-Clause"]
      identifier: ""
  - polars:
      description: Fast multi-threaded DataFrame library used for parquet IO.
      homepage: https://pola.rs
      documentation: https://docs.pola.rs
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Group meta map from createGroupChannels, e.g.,
          [ project:'cpg0016', aggregate_level:'cell', grouping_name:'treatment',
            grouping_column:'Metadata_treatment', group:'drugA', subgroup_values:[:],
            group_id:'treatment=drugA',
            group_tag:'cell__treatment__treatment=drugA', plate_ids:['plate_001','plate_002'] ]
    - parquets:
        type: file
        description: |
          Parquet files to cluster the rows of: either the feature-selected
          profiles for this group, or the single embeddings parquet from
          compute_embeddings.
        pattern: "*.parquet"
    - features_file:
        type: file
        description: |
          Selected feature list (one column name per line) from
          pycytominer_feature_select, used to cluster the feature-selected
          profiles. Pass an empty list ([]) to cluster the PC columns instead.
        pattern: "*.txt"
    - embeddings_summary_json:
        type: file
        description: |
          compute_embeddings summary JSON for this group, used to detect an
          upstream skip when clustering PCs. Pass an empty list ([]) when
          clustering the feature-selected profiles.
        pattern: "embeddings_summary_*.json"
  - - distance_metric:
        type: string
        description: |
          Distance metric for Ward clustering. One of: correlation, cosine, euclidean.
          correlation and cosine are implemented by centering (correlation only)
          and scaling each row to unit length before Ward/euclidean clustering.
  - - max_nan_fraction:
        type: number
        description: |
          Per-row NaN tolerance as a fraction of clustered columns (the pipeline
          passes sample_max_nan_fraction, so clustering and embeddings use the
          same rows). Rows above the threshold are dropped; surviving rows have
          NaNs filled with 0.
  - - max_samples:
        type: integer
        description: |
          Maximum number of samples to cluster. Groups with more rows than this
          (e.g., large cell-level groups) are skipped rather than clustered, and
          the summary JSON records skipped=true with the reason.

output:
  - result:
      - meta:
          type: map
          description: Group key map (unchanged from input).
      - "clustering_samples_linkage_*.parquet":
          type: file
          description: |
            scipy linkage matrix with one row per merge and columns
            left, right, distance, n_members.
            Leaf ids are 0..n-1 and the node created by row i is n + i.
            The tree can be rebuilt with scipy.cluster.hierarchy.to_tree().
            Empty (zero rows) for skipped groups.
          pattern: "clustering_samples_linkage_*.parquet"
      - "clustering_samples_leaves_*.parquet":
          type: file
          description: |
            One row per leaf with columns leaf_id, leaf_order (position in the
            dendrogram), label, and the grouping column, subgroup columns, and
            identifying metadata columns present in the input parquets.
            leaf_id is the row number in the clustered matrix (input rows after NaN filtering).
            Empty (zero rows) for skipped groups.
          pattern: "clustering_samples_leaves_*.parquet"
      - "clustering_samples_summary_*.json":
          type: file
          description: |
            Summary JSON with group identity, input, method, metric, NaN
            filtering counts, and n_samples.
            Skipped groups contain skipped=true and skip_reason.
          pattern: "clustering_samples_summary_*.json"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
