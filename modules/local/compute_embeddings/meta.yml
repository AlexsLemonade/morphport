name: compute_embeddings
description: |
  Computes PCA and UMAP embeddings for an analysis group.
  Reads parquet files belonging to one group, selects feature columns,
  fits PCA, and runs UMAP on the top principal components.
keywords:
  - cell painting
  - pca
  - umap
  - embeddings
  - dimensionality reduction

tools:
  - scikit-learn:
      description: Machine learning library used here for PCA.
      homepage: https://scikit-learn.org
      documentation: https://scikit-learn.org/stable/
      licence: ["BSD-3-Clause"]
      identifier: ""
  - umap-learn:
      description: Uniform Manifold Approximation and Projection for dimension reduction.
      homepage: https://github.com/lmcinnes/umap
      documentation: https://umap-learn.readthedocs.io
      licence: ["BSD-3-Clause"]
      identifier: ""
  - polars:
      description: Fast multi-threaded DataFrame library used for parquet IO and concat.
      homepage: https://pola.rs
      documentation: https://docs.pola.rs
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Group meta map from createGroupChannels, e.g.,
          [ project:'cpg0016', aggregate_level:'cell', grouping_name:'treatment',
            grouping_column:'Metadata_treatment', group:'drugA', subgroup_values:[:],
            group_id:'treatment=drugA', plate_ids:['plate_001','plate_002'] ]
    - plate_metas:
        type: list
        description: List of per-plate meta maps for all plates contributing to this group.
    - parquets:
        type: file
        description: Normalized, partitioned parquet files for this group (one per source plate per partition).
        pattern: "*.parquet"
  - - pca_components:
        type: integer
        description: Number of PCA components requested; capped at min(n_rows, n_features) at runtime.
  - - umap_neighbors:
        type: integer
        description: UMAP n_neighbors; capped at n_rows - 1 for small groups.
  - - umap_min_dist:
        type: float
        description: UMAP min_dist.
  - - random_seed:
        type: integer
        description: Random seed passed to PCA and UMAP as random_state.
  - - max_nan_fraction:
        type: float
        description: |
          Per-row NaN tolerance, expressed as a fraction of feature columns in [0.0, 1.0].
          Rows whose NaN fraction exceeds this threshold are dropped; surviving rows with
          any NaN values have those entries filled with 0 before PCA.
          Default of 0 drops any row with a NaN.
  - - min_rows:
        type: integer
        description: |
          Minimum number of rows (after NaN filtering) required to compute PCA + UMAP.
          Groups with fewer rows are skipped: a metadata-only parquet is emitted and the
          summary JSON records skipped=true with the reason.

output:
  - result:
      - meta:
          type: map
          description: Group key map (unchanged from input).
      - "embeddings_*.parquet":
          type: file
          description: |
            Embeddings parquet keyed on the surviving input rows.
            Columns: all Metadata_* columns + PC1..PCk + UMAP1 + UMAP2.
          pattern: "embeddings_*.parquet"
      - "embeddings_summary_*.json":
          type: file
          description: |
            Summary JSON with row counts, dropped-NaN count, PCA explained variance ratio,
            and the UMAP parameters used.
          pattern: "embeddings_summary_*.json"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
