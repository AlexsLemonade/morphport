name: hierarchical_clustering
description: |
  Computes hierarchical clustering of the samples within an analysis group.
  Reads the PCA embeddings for the group, clusters the PC1..PCk columns, and
  writes the scipy linkage matrix and a table of leaf labels and identifying
  metadata as parquet files, along with a JSON summary of the clustering.
keywords:
  - cell painting
  - hierarchical clustering
  - dendrogram
  - pca

tools:
  - scipy:
      description: Scientific computing library used here for hierarchical/agglomerative clustering.
      homepage: https://scipy.org
      documentation: https://docs.scipy.org/doc/scipy/reference/cluster.hierarchy.html
      licence: ["BSD-3-Clause"]
      identifier: ""
  - polars:
      description: Fast multi-threaded DataFrame library used for parquet IO.
      homepage: https://pola.rs
      documentation: https://docs.pola.rs
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Group meta map from createGroupChannels, e.g.,
          [ project:'cpg0016', aggregate_level:'cell', grouping_name:'treatment',
            grouping_column:'Metadata_treatment', group:'drugA', subgroup_values:[:],
            group_id:'treatment=drugA',
            group_tag:'cell__treatment__treatment=drugA', plate_ids:['plate_001','plate_002'] ]
    - embeddings_parquet:
        type: file
        description: PCA/UMAP embeddings parquet for this group, from compute_embeddings.
        pattern: "embeddings_*.parquet"
    - summary_json:
        type: file
        description: compute_embeddings summary JSON for this group; used to detect an upstream skip.
        pattern: "embeddings_summary_*.json"
  - - linkage_method:
        type: string
        description: |
          Linkage method passed to scipy.cluster.hierarchy.linkage.
          One of: single, complete, average, weighted, ward.
          Note: ward requires distance_metric to be euclidean.
  - - distance_metric:
        type: string
        description: |
          Distance metric passed to scipy.cluster.hierarchy.linkage.
          One of: euclidean, correlation, cosine, cityblock.
  - - max_samples:
        type: integer
        description: |
          Maximum number of samples to cluster. Groups with more rows than this
          (e.g., large cell-level groups) are skipped rather than clustered, and
          the summary JSON records skipped=true with the reason.

output:
  - result:
      - meta:
          type: map
          description: Group key map (unchanged from input).
      - "clustering_linkage_*.parquet":
          type: file
          description: |
            scipy linkage matrix with one row per merge and columns
            left, right, distance, n_members.
            Leaf ids are 0..n-1 and the node created by row i is n + i.
            The tree can be rebuilt with scipy.cluster.hierarchy.to_tree().
            Empty (zero rows) for skipped groups.
          pattern: "clustering_linkage_*.parquet"
      - "clustering_leaves_*.parquet":
          type: file
          description: |
            One row per leaf with columns leaf_id, leaf_order (position in the
            dendrogram), label, and the grouping column, subgroup columns, and
            identifying metadata columns present in the embeddings parquet.
            Empty (zero rows) for skipped groups.
          pattern: "clustering_leaves_*.parquet"
      - "clustering_summary_*.json":
          type: file
          description: |
            Summary JSON with group identity, method, metric, and n_samples.
            Skipped groups contain skipped=true and skip_reason.
          pattern: "clustering_summary_*.json"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module.

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
