name: pycytominer_feature_select
description: Select morphological features for one analysis group using pycytominer.feature_select; emits a feature-list text file alongside the original parquets.
keywords:
  - cell painting
  - pycytominer
  - feature selection
  - parquet

tools:
  - pycytominer:
      description: >
        pycytominer is a suite of common functions used to process high-throughput
        cell morphology data. This process calls pycytominer.feature_select.
      homepage: https://github.com/cytomining/pycytominer
      documentation: https://pycytominer.readthedocs.io
      licence: ["BSD-3-Clause"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Group meta map from createGroupChannels, e.g.,
          [ project:'cpg0016', aggregate_level:'well', grouping_name:'treatment',
            grouping_column:'Metadata_treatment', group:'drugA', subgroup_values:[:],
            group_id:'treatment=drugA',
            group_tag:'well__treatment__treatment=drugA', plate_ids:['plate_001','plate_002'] ]
    - plate_metas:
        type: list
        description: List of per-plate meta maps for the parquets being combined in this group
    - parquets:
        type: list
        description: One or more parquet files for the analysis group; staged into input_parquet/ and read concatenated
        pattern: "*.parquet"
  - - options:
        type: map
        description: |
          Named feature selection options. Every key is required; other keys are ignored.
            operations: Comma-separated pycytominer feature_select operations
              (e.g. 'blocklist,drop_na_columns,variance_threshold,correlation_threshold')
            na_cutoff: Maximum NaN fraction per column before drop_na_columns removes it
            corr_threshold: Correlation threshold for correlation_threshold (feature pairs above this are deduplicated)
            corr_method: Correlation method for correlation_threshold, including per-channel correlation
              (pearson, spearman, or kendall)
            freq_cut: Frequency cut for variance_threshold (ratio of 2nd-most-common to most-common value)
            unique_cut: Unique-value cut for variance_threshold (fraction of unique values to profile count)
            min_rows_stats: Minimum row count for applying statistics-based operations (variance_threshold,
              correlation_threshold, drop_outliers, noise_removal); groups below this fall back to name-based operations only
            outlier_cutoff: Maximum absolute feature value for drop_outliers; features with a larger absolute value are removed
            noise_removal_perturb_groups: Metadata column whose values define the replicate groups for noise_removal;
              must be present in the input parquets when noise_removal is an operation (null when unused)
            noise_removal_stdev_cutoff: Maximum mean within-group standard deviation for noise_removal;
              features with a larger value are removed
            per_channel_correlation: If true and correlation_threshold is an operation, run correlation_threshold
              once per channel group (features sharing the same channel set) instead of once across all features
          e.g. [ operations:'blocklist,drop_na_columns', na_cutoff:0.05, corr_threshold:0.9, corr_method:'pearson',
                 freq_cut:0.05, unique_cut:0.01, min_rows_stats:15, outlier_cutoff:500,
                 noise_removal_perturb_groups:null, noise_removal_stdev_cutoff:0.8, per_channel_correlation:false ]

output:
  - result:
      - meta:
          type: map
          description: Group meta passed through unchanged
      - plate_metas:
          type: list
          description: Per-plate meta list passed through unchanged
      - "input_parquet/*.parquet":
          type: file
          description: Input parquets passed through unmodified for downstream column-filtered reads
          pattern: "*.parquet"
      - "features_*.txt":
          type: file
          description: Newline-delimited list of selected morphological feature column names (no Metadata_* columns)
          pattern: "features_*.txt"
  - summary:
      - "feature_select_summary_*.json":
          type: file
          description: JSON sidecar with grouping info, operations, parameters, and input/output feature counts
          pattern: "feature_select_summary_*.json"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
