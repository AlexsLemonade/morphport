name: pycytominer_drop_blocklist
description: Drop redundant suffixed Metadata columns and CellProfiler features on pycytominer's default blocklist from a per-cell parquet
keywords:
  - cell painting
  - pycytominer
  - blocklist
  - feature selection
  - parquet

tools:
  - pycytominer:
      description: >
        pycytominer is a suite of common functions used to process high-throughput
        cell morphology data. This process calls feature_select(operation="blocklist").
      homepage: https://github.com/cytomining/pycytominer
      documentation: https://pycytominer.readthedocs.io
      licence: ["BSD-3-Clause"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing plate metadata,
          e.g. [ plate_id:'plate_001', batch:'batch_1' ]
    - parquet_file:
        type: file
        description: Per-cell parquet file produced by CYTOTABLE_CONVERT
        pattern: "*.parquet"

output:
  - result:
      - meta:
          type: map
          description: Groovy Map containing plate metadata (passed through unchanged)
      - "*.parquet":
          type: file
          description: Per-cell parquet with blocklist features and redundant suffixed Metadata columns dropped
          pattern: "*_blocklist_filtered.parquet"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
