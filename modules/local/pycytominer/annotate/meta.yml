name: pycytominer_annotate
description: Annotate a per-plate parquet file with platemap metadata using pycytominer.annotate
keywords:
  - cell painting
  - pycytominer
  - annotate
  - platemap
  - parquet

tools:
  - pycytominer:
      description: >
        pycytominer is a suite of common functions used to process high-throughput
        cell morphology data. This process calls pycytominer.annotate.
      homepage: https://github.com/cytomining/pycytominer
      documentation: https://pycytominer.readthedocs.io
      licence: ["BSD-3-Clause"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing plate metadata,
          e.g. [ plate_id:'plate_001', batch:'batch_1', plate_metadata_columns:['Metadata_compound','Metadata_dose'] ]
    - parquet_files:
        type: file
        description: |
          One or more per-cell parquet files for a plate (e.g., from CYTOTABLE_CONVERT).
          Multiple files are concatenated before annotation.
        pattern: "*.parquet"
    - platemap_file:
        type: file
        description: Comma-delimited (.csv) or tab-delimited (.tsv, .txt) platemap with a column matching the well identifier
        pattern: "*.{tsv,txt}"
  - - platemap_well_column:
        type: string
        description: Name of the well column in the platemap (without the Metadata_ prefix)

output:
  - result:
      - meta:
          type: map
          description: Groovy Map containing plate metadata (passed through unchanged)
      - "*.parquet":
          type: file
          description: Annotated per-cell parquet with platemap-derived Metadata_* columns merged in
          pattern: "*_annotated.parquet"
  - warnings:
      - task.process:
          type: string
          description: Name of the process that produced the warnings
      - meta.plate_id:
          type: string
          description: Plate identifier the warnings apply to
      - "*_metadata_warnings.txt":
          type: file
          description: |
            Optional text file with warnings about duplicated metadata columns, one per line
            (conflicting values, coalesced columns, or identical values under different names).
            Only created when there is something to report.
            Also sent to the `warnings` topic channel.
          pattern: "*_metadata_warnings.txt"
  - versions:
      - versions.yml:
          type: file
          description: YAML file containing versions of tools used in the module

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64

authors:
  - "@jashapiro"
maintainers:
  - "@jashapiro"
