# Analysis groups for stub runs; see docs/analysis_groups_format.md for the format.
# Stub platemap columns: gene_allele (both platemaps), treatment (platemap_001 only), plate_map_name (both).
# The stub_* columns are in neither platemap, so every plate gets the value '_Absent_'.
default:
  - name: stub_condition
    grouping_column: stub_condition
    groups: one_per_value
cell:
  - name: stub_target
    grouping_column: stub_target
    groups: one_per_value
well:
  # Alleles compared with wild type within each platemap:
  # every group has reference wells, so it is reference normalized and scored for phenotypic activity
  - name: allele_vs_wt
    grouping_column: plate_map_name
    groups: one_per_value
    comparison_column: gene_allele
    reference_values: [wt]
  # Platemaps compared within each allele, with wild-type reference wells:
  # the 'mut' group has no reference wells, so it skips reference normalization and phenotypic activity
  - name: platemap_by_allele
    grouping_column: gene_allele
    groups: one_per_value
    comparison_column: plate_map_name
    reference_column: gene_allele
    reference_values: [wt]
