# Minimal analysis groups for the `test` profile, used with samplesheet_minimal.csv; see docs/analysis_groups_format.md for the format.
# Platemap columns: cell_line, seeding_density, condition, time_point
# Each group runs the full analysis, so there is only one grouping per aggregate level (plus the default),
# enough for every analysis step to run on real data.
# The forms of `groups` are tested separately; analysis_groups.yml has more groupings.
default:
  # The neuroblastoma cell lines, with the U2-OS anchor cell line
  - name: neuroblastoma
    grouping_column: cell_line
    groups:
      neuroblastoma: [IMR32, KP-N-YN, NB-1]
    always_include: [U2-OS]
    excluded: [DAOY, SJSA-1, SK-N-MC]
cell:
  # The U2-OS anchor cell line, present on every plate (the minimal samplesheet has a single time point)
  - name: u2os_anchor
    grouping_column: time_point
    filter:
      cell_line: [U2-OS]
    groups: all_values
well:
  # All cell lines together
  - name: all_cell_lines
    grouping_column: cell_line
    groups: all_values
