# Analysis groups for the synthetic test data (`test` profile); see docs/analysis_groups_format.md for the format.
# Platemap columns: cell_line, treatment (see tests/data/README.md for the layout).
# Each group runs the full analysis, so there are only enough groups to run every analysis step on real data.
# The forms of `groups` (named groups, always_include, excluded, filter) are tested by the analysis group tests.
default:
  # All wells together, at both aggregate levels
  - name: all_wells
    grouping_column: cell_line
    groups: all_values
well:
  # Drug compared with DMSO within each cell line, for reference normalization and phenotypic activity:
  # mixed has DMSO and drug wells, so it is reference normalized and scored;
  # dmso_only has no drug wells, so it is reference normalized, but phenotypic activity has nothing to score and skips it;
  # one_dmso has a single DMSO well per plate, too few to normalize to, so reference normalization skips it and it is not scored
  - name: drug_vs_dmso
    grouping_column: cell_line
    groups: one_per_value
    comparison_column: treatment
    reference_values: [DMSO]
