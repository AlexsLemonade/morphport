# Analysis groups for the simulated REPO1 screen data (`test_full_screen` profile); see docs/analysis_groups_format.md for the format.
# Platemap columns include Cell_Line_Name (SK-N-AS, and simulated U2-OS plates), compound_id (BRD IDs, DMSO, or untreated),
# Treatment_Control_Class (Treatment, NegCon, or Control), and Treatment_Mechanism (mechanisms separated by |); see tests/data-full/README.md.
# Compounds are identified by compound_id rather than name, as a few names cover more than one compound ID.
# Every grouping is split by cell line, so each cell line's compounds are compared with its own DMSO wells.
# The mechanism groups list each mechanism's compounds on the screen plates; a compound with more than one mechanism is in each of their groups.
cell:
  # DMSO and untreated wells together, for each cell line
  - name: controls
    grouping_column: Cell_Line_Name
    groups: one_per_value
    filter:
      Treatment_Control_Class: [NegCon, Control]

  # The 3 mechanisms with the most compounds, each with DMSO
  - name: mechanisms
    grouping_column: compound_id
    # compounds with any of these mechanisms, and wells with no mechanism (DMSO, untreated, and unannotated compounds)
    filter:
      Treatment_Mechanism:
        - "acetylcholine receptor antagonist"
        - "adrenergic receptor antagonist"
        - "adrenergic receptor antagonist|dopamine receptor antagonist"
        - "bacterial cell wall synthesis inhibitor"
        - "bacterial cell wall synthesis inhibitor|penicillin binding protein inhibitor"
        - _NA_
